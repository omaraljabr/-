<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة الأسئلة | ExamPro</title>
    <link rel="stylesheet" href="Stayle.css">
</head>

<body>

<header class="top-header">
    <div class="brand">
        <img src="../image/philips.jpeg" alt="شعار ExamPro" class="logo">
        <div class="brand-info">
            <h1>ExamPro</h1>
            <p>نظام إدارة الامتحانات الإلكترونية</p>
        </div>
    </div>
</header>

<main class="dashboard">

    <section class="welcome-section">
        <div>
            <span class="section-label">إدارة الامتحانات</span>
            <h2>إضافة سؤال جديد</h2>
            <p>أضف الأسئلة وحدد الخيارات والإجابة الصحيحة.</p>
        </div>
    </section>

    <section class="exam-form-card">

        <div class="form-card-header">
            <h3>بيانات السؤال</h3>
        </div>

        <form id="question-form">

            <div class="form-group">
                <label for="question-exam">اختر الامتحان</label>
                <select id="question-exam" required>
                    <option value="">-- اختر الامتحان --</option>
                </select>
            </div>

            <div class="form-group">
                <label for="question-text">نص السؤال</label>
                <textarea id="question-text" rows="4"
                    placeholder="اكتب السؤال هنا..." required></textarea>
            </div>

            <div class="form-group">
                <label for="option-a">الخيار الأول</label>
                <input type="text" id="option-a" placeholder="الخيار الأول" required>
            </div>

            <div class="form-group">
                <label for="option-b">الخيار الثاني</label>
                <input type="text" id="option-b" placeholder="الخيار الثاني" required>
            </div>

            <div class="form-group">
                <label for="option-c">الخيار الثالث</label>
                <input type="text" id="option-c" placeholder="الخيار الثالث" required>
            </div>

            <div class="form-group">
                <label for="option-d">الخيار الرابع</label>
                <input type="text" id="option-d" placeholder="الخيار الرابع" required>
            </div>

            <div class="form-group">
                <label for="correct-answer">الإجابة الصحيحة</label>
                <select id="correct-answer" required>
                    <option value="">-- اختر الإجابة الصحيحة --</option>
                    <option value="a">الخيار الأول</option>
                    <option value="b">الخيار الثاني</option>
                    <option value="c">الخيار الثالث</option>
                    <option value="d">الخيار الرابع</option>
                </select>
            </div>

            <div class="form-actions">
                <a href="admin.html" class="btn-cancel">العودة للإدارة</a>
                <button type="submit" class="btn-primary">حفظ السؤال</button>
            </div>

            <p id="question-message" role="status" aria-live="polite"></p>

        </form>
    </section>

</main>

<script src="add-question.js"></script>


</body>
</html>
