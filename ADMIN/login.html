
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>دخول الإدارة | ExamPro</title>

    <link rel="stylesheet" href="Stayle.css">
</head>

<body class="login-page">

    <main class="login-container">

        <!-- Logo -->
        <div class="login-brand">

            <img
                src="../image/philips.jpeg"
                alt="شعار ExamPro"
                class="login-logo"
            >

            <h1>ExamPro</h1>

            <p>نظام إدارة الامتحانات الإلكترونية</p>

        </div>


        <!-- Login Card -->
        <section class="login-card">

            <div class="login-icon">
                🔐
            </div>

            <div class="login-heading">

                <h2>مرحبًا بعودتك</h2>

                <p>سجّل الدخول للوصول إلى لوحة الإدارة.</p>

            </div>


            <form id="login-form">

                <div class="form-group">

                    <label for="username">
                        اسم المستخدم
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="أدخل اسم المستخدم"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        كلمة المرور
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="أدخل كلمة المرور"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button type="submit" class="login-button">

                    <span>تسجيل الدخول</span>

                    <span class="login-arrow">←</span>

                </button>

                <p id="login-message" class="login-message"
                    role="status" aria-live="polite"></p>

            </form>

        </section>


        <!-- Footer -->
        <footer class="login-footer">

            <p>© 2026 ExamPro</p>

            <span>نحو تجربة تعليمية أكثر تطورًا</span>

        </footer>

    </main>


    <script src="Script.js"></script>

</body>

</html>
