<!DOCTYPE html>

<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamPro | تسجيل الطالب</title>
    <link rel="stylesheet" href="css/stayle.css">
</head>
<body>

```
<header class="site-header">
    <div class="brand">
        <img src="image/منصة استكشاف المواهب الرقمية.png"
             alt="شعارات مجموعة Bosphorlead والأكاديميات"
             class="logo">
    </div>
</header>

<main class="page-container">

    <section class="welcome-section">
        <span class="welcome-badge">المرحلة الأولى</span>
        <h2>مرحبًا بك في منصة استكشاف المواهب الرقمية</h2>
        <p>أدخل بياناتك للانتقال إلى قائمة الاختبارات المتاحة.</p>
    </section>

    <section class="student-card">

        <div class="card-heading">
            <div class="heading-icon">👤</div>
            <div>
                <h3>بيانات الطالب</h3>
                <p>يرجى تعبئة جميع الحقول</p>
            </div>
        </div>

        <form id="student-form">

            <div class="form-group">
                <label for="fullName">الاسم الكامل</label>
                <input
                    type="text"
                    id="fullName"
                    name="fullName"
                    placeholder="أدخل اسمك الكامل"
                    autocomplete="name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">البريد الإلكتروني</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="example@email.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="phone">رقم الجوال</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="أدخل رقم الجوال مع مفتاح الدولة"
                    autocomplete="tel"
                    required
                >
            </div>

            <div id="form-message"
                 class="form-message"
                 role="status"
                 aria-live="polite"></div>

            <button type="submit" id="continue-button">
                التالي: عرض الاختبارات ←
            </button>

        </form>
    </section>

    <footer class="site-footer">
        <p>منصه الاختبارات المواهب © 2026 — جميع الحقوق محفوظة</p>
    </footer>

</main>

<script src="js/script.js"></script>
```

</body>
</html>
